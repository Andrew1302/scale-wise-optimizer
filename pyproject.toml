[project]
name = "scale-wise-optimizer"
version = "0.1.0"
description = "Per-cluster image resolution policies for vision-language benchmarks"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "pandas-stubs>=2.3.2.250926",
    "dotenv>=0.9.9",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.2.1",
    "nbformat>=5.10.4",
    "nltk>=3.9.2",
    "nbconvert>=7.17.0",
    "lmms-eval",
    # Qwen3.5 (model_type "qwen3_5") is unknown to transformers 5.1, which uv
    # otherwise resolves to.
    "transformers>=5.14",
    "pillow>=10.0.0",
]

# The published lmms-eval 0.7.2 wheel ships no `_default_template_yaml` files (they
# have no extension, and that release predates the `tasks/**/*` package-data glob),
# so every task fails to load. Pin the commit instead.
[tool.uv.sources]
lmms-eval = { git = "https://github.com/EvolvingLMMs-Lab/lmms-eval", rev = "75571cfe0fa36ca5ec2e6aa2bb268f9d38295af3" }

[project.optional-dependencies]
dev = ["ruff", "pytest>=8.0"]

# Registers `swo.model.BudgetedModel` with lmms-eval. `ModelRegistryV2` reads this
# group at import time, so `lmms-eval --model resolution_budget` resolves without
# any change to the lmms-eval installation.
[project.entry-points."lmms_eval.models"]
resolution_budget = "swo.registry:MANIFEST"

[dependency-groups]
dev = ["ipykernel>=7.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swo"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
